<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#050e1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2ba6f"/>
      <stop offset="50%" stop-color="#fdf0cd"/>
      <stop offset="100%" stop-color="#c99742"/>
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#e2ba6f" stroke-opacity="0.2" stroke-width="3"/>
  
  <!-- Coastal Wave & Sun Arch -->
  <g transform="translate(106, 120)">
    <!-- Sun Arch -->
    <path d="M 30,120 A 120,120 0 0,1 270,120" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Ocean Wave -->
    <path d="M 10,135 C 70,135 110,80 150,80 C 180,80 195,110 205,120 C 220,135 250,135 290,135" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 40,150 C 90,150 120,115 150,115 C 175,115 185,135 200,145 C 220,155 250,150 280,150" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Monogram VBZH -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="88" font-weight="700" letter-spacing="14" fill="url(#gold)" text-anchor="middle">
    VBZH
  </text>
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#e2ba6f" opacity="0.8" text-anchor="middle">
    VIRGINIA BEACH
  </text>
</svg>
